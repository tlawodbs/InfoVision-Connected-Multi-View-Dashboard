<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chocolate Sales Dashboard</title>
  <!-- D3.js library -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Embedded styles -->
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; }
    #controls { text-align: right; margin-bottom: 10px; }
    #dashboard { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 20px; }
    #area-chart, #bar-chart { position: relative; }
    #table-container { grid-column: span 2; max-height: 300px; overflow-y: auto; }
    svg { width: 100%; height: 500px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 6px; border: 1px solid #ccc; }
    tr:hover { background: #f0f0f0; }
    tr.selected { background: #d0ebff; }
    .bar.selected { stroke: #333; stroke-width: 2px; }
    .area.selected { fill-opacity: 1; stroke: #333; stroke-width: 1.5px; }
    .tooltip { position: absolute; text-align: center; padding: 8px; background: white; border: 1px solid #ddd; border-radius: 4px; pointer-events: none; font-size: 12px; }
    .checkboxes { column-count: 3; column-gap: 20px; margin-bottom: 15px; }
    .checkboxes label { display: block; cursor: pointer; }
    .color-box { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: middle; }
  </style>

  <!-- Application logic -->
  <script defer src="dashboard.js"></script>
</head>
<body>
  <div id="controls">
    <header>
      <h1 style="text-align: center;">Chocolate Sales Dashboard</h1>
    <button id="reset-btn">Reset Dashboard</button>
  </div>
  <div id="dashboard">
    <div id="area-chart"></div>
    <div id="bar-chart">
      <div class="checkboxes"></div>
      <svg></svg>
    </div>
    <div id="table-container"></div>
  </div>
</body>
</html>
