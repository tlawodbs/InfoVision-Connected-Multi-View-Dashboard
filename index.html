<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chocolate Sales Dashboard</title>
  <!-- D3.js library -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Embedded styles -->
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; }
    #controls { text-align: right; margin-bottom: 10px; }
    #dashboard { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 20px; }
    #area-chart, #bar-chart { position: relative; }
    #table-container { grid-column: span 2; max-height: 300px; overflow-y: auto; }
    /* 기본 SVG 사이즈 */
    svg { width: 100%; height: 500px; }
    /* 브러시 스타일(도구) */
    .brush .overlay { shape-rendering: auto; }
    .brush .selection { fill: #777; fill-opacity: 0.3; stroke: none; shape-rendering: crispEdges; }
  </style>

  <!-- Application logic -->
  <script defer src="dashboard.js"></script>
</head>
<body>
  <div id="controls">
    <header>
      <h1 style="text-align: center;">Chocolate Sales Dashboard</h1>
      <button id="reset-btn">Reset Dashboard</button>
    </header>
  </div>
  <div id="dashboard">
    <!-- Area Chart -->
    <div id="area-chart"></div>
    <!-- Bar Chart -->
    <div id="bar-chart">
      <div class="checkboxes"></div>
      <svg></svg>
    </div>
    <!-- Data Table -->
    <div id="table-container"></div>
  </div>
</body>
</html>
